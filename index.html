<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneLife - Life Simulation</title>
    <style>
        /* ----- GLOBAL RESET & DARK THEME ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: #0b0f17;
            color: #e6edf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        #app {
            max-width: 1300px;
            width: 100%;
            background: #10161f;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
            position: relative;
        }
        /* scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #10161f;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3c5a;
            border-radius: 8px;
        }

        /* ----- TOP BAR ----- */
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            padding: 10px 20px;
            background: #0d121b;
            border-bottom: 1px solid #1a2535;
        }
        .top-bar .logo {
            font-weight: 700;
            font-size: 1.2rem;
            color: #b8a35c;
            letter-spacing: 0.5px;
        }
        .top-bar .logo span {
            color: #4a7eb5;
        }
        .top-bar .btn {
            background: #1a2535;
            border: none;
            color: #b8c8e0;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        .top-bar .btn:hover {
            background: #2a3c5a;
            color: #fff;
        }
        .top-bar .btn.new-life {
            background: #b8a35c;
            color: #0b0f17;
        }
        .top-bar .btn.new-life:hover {
            background: #cfb86e;
        }
        .top-bar .spacer {
            flex: 1;
        }
        .top-bar .hidden-toggle {
            background: #1a2535;
            border: 1px solid #2a3c5a;
            color: #8aa0c0;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .top-bar .hidden-toggle:hover {
            background: #2a3c5a;
            color: #fff;
        }
        .top-bar .hidden-toggle.active {
            background: #2a3c5a;
            color: #fff;
            border-color: #4a7eb5;
        }

        /* ----- CHARACTER CARD ----- */
        .char-card {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 20px;
            padding: 8px 20px;
            background: #0d121b;
            border-bottom: 1px solid #1a2535;
            font-size: 0.9rem;
        }
        .char-card .name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff;
        }
        .char-card .badge {
            background: #1a2535;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: #b0c4e0;
        }
        .char-card .stat-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
            margin-left: auto;
        }
        .char-card .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
        }
        .char-card .stat-item .bar-bg {
            width: 60px;
            height: 6px;
            background: #1a2535;
            border-radius: 4px;
            overflow: hidden;
        }
        .char-card .stat-item .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }
        .char-card .stat-item .bar-fill.green {
            background: #4caf84;
        }
        .char-card .stat-item .bar-fill.blue {
            background: #4299e1;
        }
        .char-card .stat-item .bar-fill.purple {
            background: #9f7aea;
        }
        .char-card .stat-item .bar-fill.pink {
            background: #e879b8;
        }
        .char-card .stat-value {
            min-width: 22px;
            text-align: right;
            font-weight: 500;
            font-size: 0.75rem;
            color: #b0c4e0;
        }

        /* ----- AGE & MONEY BAR ----- */
        .age-money-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 18px;
            padding: 6px 20px;
            background: #0d121b;
            border-bottom: 1px solid #1a2535;
            font-size: 0.9rem;
        }
        .age-money-bar .age {
            font-weight: 600;
            font-size: 1.1rem;
            color: #4a7eb5;
        }
        .age-money-bar .money {
            font-weight: 600;
            font-size: 1.1rem;
            color: #b8a35c;
        }
        .age-money-bar .job {
            color: #8aa0c0;
            font-size: 0.85rem;
        }
        .age-money-bar .prison-badge {
            background: #c0392b;
            padding: 2px 14px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
        }
        .age-money-bar .alive-badge {
            background: #4caf84;
            padding: 2px 14px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
        }
        .age-money-bar .dead-badge {
            background: #e74c3c;
            padding: 2px 14px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
        }

        /* ----- MAIN LAYOUT ----- */
        .main-layout {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .sidebar {
            width: 200px;
            min-width: 160px;
            background: #0d121b;
            padding: 12px 0;
            border-right: 1px solid #1a2535;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar .cat-item {
            padding: 10px 18px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #8aa0c0;
            border-left: 3px solid transparent;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar .cat-item:hover {
            background: #141c2b;
            color: #e6edf5;
        }
        .sidebar .cat-item.active {
            background: #141c2b;
            color: #fff;
            border-left-color: #4a7eb5;
        }
        .sidebar .cat-item .icon {
            font-size: 1.1rem;
        }
        .content-area {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            background: #10161f;
            min-height: 300px;
        }
        .content-area .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4a6a8a;
            margin-bottom: 12px;
        }
        .content-area .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }
        .content-area .grid .action-btn {
            background: #141c2b;
            border: 1px solid #1a2535;
            border-radius: 12px;
            padding: 12px 8px;
            color: #d0d8e8;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .content-area .grid .action-btn:hover {
            background: #1a2535;
            border-color: #2a3c5a;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
        }
        .content-area .grid .action-btn:active {
            transform: scale(0.96);
        }
        .content-area .grid .action-btn .icon {
            font-size: 1.4rem;
        }
        .content-area .grid .action-btn.crime {
            border-color: #5a1a1a;
        }
        .content-area .grid .action-btn.crime:hover {
            border-color: #c0392b;
            background: #1a0e0e;
        }
        .content-area .grid .action-btn.relationship {
            border-color: #5a1a4a;
        }
        .content-area .grid .action-btn.relationship:hover {
            border-color: #c0397a;
            background: #1a0e14;
        }
        .content-area .grid .action-btn.job {
            border-color: #1a4a5a;
        }
        .content-area .grid .action-btn.job:hover {
            border-color: #2d7bb5;
            background: #0e1a2a;
        }
        .content-area .grid .action-btn.activity {
            border-color: #2a4a2a;
        }
        .content-area .grid .action-btn.activity:hover {
            border-color: #4a8a4a;
            background: #0e1a0e;
        }
        .content-area .grid .action-btn.heirloom {
            border-color: #5a4a1a;
        }
        .content-area .grid .action-btn.heirloom:hover {
            border-color: #b8a35c;
            background: #1a140e;
        }
        .content-area .grid .action-btn.bitpass {
            border-color: #3a2a5a;
        }
        .content-area .grid .action-btn.bitpass:hover {
            border-color: #7a4ac9;
            background: #140e1a;
        }
        .content-area .grid .action-btn.school {
            border-color: #1a4a5a;
        }
        .content-area .grid .action-btn.school:hover {
            border-color: #2d8a9a;
            background: #0e1a1a;
        }
        .content-area .grid .action-btn.assets {
            border-color: #2a4a3a;
        }
        .content-area .grid .action-btn.assets:hover {
            border-color: #4a8a6a;
            background: #0e1a14;
        }
        .content-area .grid .action-btn.age {
            border-color: #3a4a6a;
            background: #1a2535;
            font-size: 1rem;
            font-weight: 700;
        }
        .content-area .grid .action-btn.age:hover {
            border-color: #4a7eb5;
            background: #1a2a4a;
        }
        .content-area .grid .action-btn .sub {
            font-size: 0.65rem;
            color: #6a8aaa;
            font-weight: 400;
        }

        /* ----- HIDDEN TRAITS PANEL ----- */
        .hidden-panel {
            background: #0d121b;
            border-bottom: 1px solid #1a2535;
            padding: 0 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, padding 0.35s ease;
        }
        .hidden-panel.open {
            max-height: 300px;
            padding: 12px 20px;
        }
        .hidden-panel .traits-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 24px;
            font-size: 0.85rem;
        }
        .hidden-panel .traits-grid .trait {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #8aa0c0;
        }
        .hidden-panel .traits-grid .trait .val {
            font-weight: 600;
            color: #d0d8e8;
            min-width: 28px;
        }
        .hidden-panel .traits-grid .trait .bar-bg {
            width: 80px;
            height: 4px;
            background: #1a2535;
            border-radius: 4px;
            overflow: hidden;
        }
        .hidden-panel .traits-grid .trait .bar-fill {
            height: 100%;
            border-radius: 4px;
            background: #4a7eb5;
        }

        /* ----- LOG AREA ----- */
        .log-area {
            background: #0b0f17;
            border-top: 1px solid #1a2535;
            padding: 6px 20px 10px;
            max-height: 140px;
            overflow-y: auto;
            font-size: 0.8rem;
            color: #8aa0c0;
            flex-shrink: 0;
        }
        .log-area .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #0d121b;
            display: flex;
            gap: 8px;
        }
        .log-area .log-entry .age-tag {
            color: #4a6a8a;
            font-weight: 600;
            min-width: 44px;
        }
        .log-area .log-entry .msg {
            color: #c8d0e0;
        }
        .log-area .log-entry .msg .highlight {
            color: #b8a35c;
        }

        /* ----- FLOAT OVERLAY (glass) ----- */
        .float-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .float-overlay.show {
            opacity: 1;
        }
        .float-overlay .glass {
            background: rgba(13, 18, 27, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(74, 126, 181, 0.25);
            border-radius: 40px;
            padding: 24px 48px;
            box-shadow: 0 0 60px rgba(74, 126, 181, 0.15), inset 0 0 60px rgba(74, 126, 181, 0.05);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            pointer-events: none;
            max-width: 90vw;
        }
        .float-overlay.show .glass {
            transform: scale(1);
        }
        .float-overlay .glass .tagline {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 40px rgba(74, 126, 181, 0.3);
            letter-spacing: 0.5px;
            line-height: 1.3;
        }
        .float-overlay .glass .tagline .emoji {
            font-size: 2.6rem;
        }
        @media (max-width: 600px) {
            .float-overlay .glass {
                padding: 16px 24px;
                border-radius: 28px;
            }
            .float-overlay .glass .tagline {
                font-size: 1.4rem;
            }
            .float-overlay .glass .tagline .emoji {
                font-size: 1.8rem;
            }
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 820px) {
            .sidebar {
                width: 140px;
                min-width: 120px;
            }
            .sidebar .cat-item {
                padding: 8px 12px;
                font-size: 0.8rem;
            }
            .content-area .grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            .char-card .stat-group {
                margin-left: 0;
                width: 100%;
            }
            .char-card .stat-item .bar-bg {
                width: 40px;
            }
        }
        @media (max-width: 600px) {
            #app {
                border-radius: 12px;
                min-height: 96vh;
            }
            .top-bar {
                padding: 8px 12px;
                gap: 4px 8px;
            }
            .top-bar .logo {
                font-size: 1rem;
            }
            .top-bar .btn {
                font-size: 0.7rem;
                padding: 4px 10px;
            }
            .char-card {
                padding: 8px 12px;
                font-size: 0.8rem;
            }
            .char-card .name {
                font-size: 0.95rem;
            }
            .char-card .stat-item .bar-bg {
                width: 32px;
            }
            .age-money-bar {
                padding: 4px 12px;
                font-size: 0.8rem;
                gap: 6px 12px;
            }
            .main-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: unset;
                display: flex;
                flex-wrap: wrap;
                padding: 6px 8px;
                border-right: none;
                border-bottom: 1px solid #1a2535;
                gap: 2px;
                overflow-x: auto;
            }
            .sidebar .cat-item {
                padding: 6px 12px;
                font-size: 0.75rem;
                border-left: none;
                border-bottom: 2px solid transparent;
                white-space: nowrap;
            }
            .sidebar .cat-item.active {
                border-bottom-color: #4a7eb5;
                border-left-color: transparent;
            }
            .content-area {
                padding: 12px;
            }
            .content-area .grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 6px;
            }
            .content-area .grid .action-btn {
                padding: 8px 4px;
                font-size: 0.75rem;
            }
            .content-area .grid .action-btn .icon {
                font-size: 1.1rem;
            }
            .log-area {
                max-height: 100px;
                padding: 4px 12px 8px;
                font-size: 0.7rem;
            }
            .hidden-panel .traits-grid {
                gap: 4px 12px;
                font-size: 0.75rem;
            }
            .hidden-panel .traits-grid .trait .bar-bg {
                width: 50px;
            }
        }
        @media (max-width: 400px) {
            .content-area .grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }
            .content-area .grid .action-btn {
                font-size: 0.7rem;
                padding: 6px 2px;
            }
            .content-area .grid .action-btn .icon {
                font-size: 0.9rem;
            }
        }

        /* ----- UTILITY ----- */
        .text-gold {
            color: #b8a35c;
        }
        .text-muted {
            color: #6a8aaa;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gap-8 {
            gap: 8px;
        }
        .w-full {
            width: 100%;
        }
        .text-center {
            text-align: center;
        }

        /* ----- Hidden file input ----- */
        #fileInput {
            display: none;
        }

        /* ----- New Life overlay ----- */
        .new-life-overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 15, 23, 0.94);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 20px;
            padding: 32px;
        }
        .new-life-overlay.hidden {
            display: none;
        }
        .new-life-overlay h1 {
            font-size: 3rem;
            color: #b8a35c;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .new-life-overlay p {
            color: #8aa0c0;
            font-size: 1.1rem;
            margin-bottom: 24px;
        }
        .new-life-overlay .btn-start {
            background: #b8a35c;
            border: none;
            color: #0b0f17;
            padding: 14px 48px;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 0 40px rgba(184, 163, 92, 0.15);
        }
        .new-life-overlay .btn-start:hover {
            transform: scale(1.04);
            box-shadow: 0 0 60px rgba(184, 163, 92, 0.25);
        }
        .new-life-overlay .btn-start:active {
            transform: scale(0.96);
        }
        @media (max-width: 600px) {
            .new-life-overlay h1 {
                font-size: 2rem;
            }
            .new-life-overlay p {
                font-size: 0.9rem;
            }
            .new-life-overlay .btn-start {
                padding: 12px 32px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- NEW LIFE OVERLAY -->
    <div class="new-life-overlay" id="newLifeOverlay">
        <h1>🎲 OneLife</h1>
        <p>Live a life. Make choices. Face consequences.</p>
        <button class="btn-start" id="btnNewLife">New Life</button>
    </div>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="logo">One<span>Life</span></div>
        <button class="btn new-life" id="btnNewLifeTop">✦ New Life</button>
        <button class="btn" id="btnSave">💾 Save</button>
        <button class="btn" id="btnLoad">📂 Load</button>
        <input type="file" id="fileInput" accept=".onelife" />
        <span class="spacer"></span>
        <button class="hidden-toggle" id="hiddenToggle">🧩 Show Hidden Traits</button>
    </div>

    <!-- CHARACTER CARD -->
    <div class="char-card" id="charCard">
        <span class="name" id="charName">—</span>
        <span class="badge" id="charGender">—</span>
        <span class="badge" id="charCountry">—</span>
        <div class="stat-group" id="statGroup">
            <span class="stat-item">❤️ <span class="bar-bg"><span class="bar-fill green" id="happinessBar" style="width:0%"></span></span><span class="stat-value" id="happinessVal">0</span></span>
            <span class="stat-item">🩺 <span class="bar-bg"><span class="bar-fill blue" id="healthBar" style="width:0%"></span></span><span class="stat-value" id="healthVal">0</span></span>
            <span class="stat-item">🧠 <span class="bar-bg"><span class="bar-fill purple" id="smartsBar" style="width:0%"></span></span><span class="stat-value" id="smartsVal">0</span></span>
            <span class="stat-item">😎 <span class="bar-bg"><span class="bar-fill pink" id="looksBar" style="width:0%"></span></span><span class="stat-value" id="looksVal">0</span></span>
        </div>
    </div>

    <!-- AGE & MONEY BAR -->
    <div class="age-money-bar" id="ageMoneyBar">
        <span class="age" id="ageDisplay">Age: 0</span>
        <span class="money" id="moneyDisplay">💰 $0</span>
        <span class="job" id="jobDisplay">Unemployed</span>
        <span class="job" id="eduDisplay">Education: None</span>
        <span style="flex:1"></span>
        <span id="statusBadge"></span>
    </div>

    <!-- HIDDEN TRAITS PANEL -->
    <div class="hidden-panel" id="hiddenPanel">
        <div class="traits-grid" id="traitsGrid"></div>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="main-layout">
        <nav class="sidebar" id="sidebar"></nav>
        <div class="content-area" id="contentArea">
            <div class="section-title" id="sectionTitle">Select a category</div>
            <div class="grid" id="actionGrid"></div>
        </div>
    </div>

    <!-- EVENT LOG -->
    <div class="log-area" id="logArea"></div>

    <!-- FLOAT OVERLAY -->
    <div class="float-overlay" id="floatOverlay">
        <div class="glass">
            <div class="tagline" id="taglineText">✨ Life</div>
        </div>
    </div>
</div>

<script>
    // ================================================================
    //  ONELIFE — Complete Game
    //  All code in one file, vanilla JS.
    //  Extensible via menuConfig and applyEffects.
    // ================================================================

    // ---------- APPLY EFFECTS (extensible core) ----------
    /**
     * applyEffects(effects)
     *  effects: { health, happiness, smarts, looks, money, athleticism,
     *             discipline, fertility, karma, willpower, ... }
     *  All numeric values are added to current state, then clamped 0-100
     *  (money is not clamped, but kept >= 0).
     *  Use this in every action for consistency.
     */
    function applyEffects(effects) {
        const map = {
            health: 'health',
            happiness: 'happiness',
            smarts: 'smarts',
            looks: 'looks',
            athleticism: 'athleticism',
            discipline: 'discipline',
            fertility: 'fertility',
            karma: 'karma',
            willpower: 'willpower'
        };
        for (const [key, val] of Object.entries(effects)) {
            if (key === 'money') {
                G.money = Math.max(0, G.money + val);
                continue;
            }
            if (map[key]) {
                G[map[key]] = clamp(G[map[key]] + val, 0, 100);
                continue;
            }
            // direct property
            if (key in G && typeof G[key] === 'number') {
                G[key] = clamp(G[key] + val, 0, 100);
            }
        }
        ['health', 'happiness', 'smarts', 'looks', 'athleticism', 'discipline', 'fertility', 'karma', 'willpower']
        .forEach(s => { G[s] = clamp(G[s], 0, 100); });
        G.money = Math.max(0, G.money);
    }

    // AI Tagline via OpenRouter
    async function fetchAITagline(actionContext) {
        const apiKey = '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';
        const url = 'https://openrouter.ai/api/v1/chat/completions';
        const systemPrompt =
            `You are a witty AI that generates sarcastic, funny, or clever taglines for a life simulation game. The game features aging, stats (happiness, health, smarts, looks), careers, education, relationships, crime, random events, and death. Generate a single short, witty tagline (under 10 words) based on the action context. Be humorous, dark, or sarcastic. Respond with ONLY the tagline text, no quotes.`;

        try {
            const resp = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`,
                    'HTTP-Referer': 'https://onelife.local',
                },
                body: JSON.stringify({
                    model: 'openai/gpt-3.5-turbo',
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: actionContext }
                    ],
                    max_tokens: 30,
                    temperature: 0.9,
                })
            });
            if (!resp.ok) throw new Error('AI API error');
            const data = await resp.json();
            const tag = data.choices?.[0]?.message?.content?.trim() || '';
            if (tag && tag.length > 0 && tag.length < 80) return tag;
            throw new Error('Empty or too long');
        } catch (_) {
            return null;
        }
    }

    async function getTagline(actionContext) {
        // 80% static, 20% AI
        if (Math.random() < 0.8) {
            return pick(STATIC_TAGLINES);

        try {
            const aiTag = await Promise.race([
                fetchAITagline(actionContext),
                new Promise((_, rej) => setTimeout(() => rej('timeout'), 2500))
            ]);
            if (aiTag) return aiTag;
        } catch (_) { /* fall through */ }
        return pick(STATIC_TAGLINES);
    }

            const income = rand(50, 400) + (G.smarts * 2) + (G.discipline * 1.5);
            applyEffects({ money: Math.floor(income) });
            addLog(`Worked as ${G.job} and earned $${Math.floor(income)}`);
        }

        // If married, relationship effects
        if (G.married && !G.inPrison) {
            if (Math.random() < 0.4) {
                const delta = rand(-3, 6);
                applyEffects({ happiness: delta });
                if (delta > 0) addLog('Your marriage brought you joy ❤️');
                else if (delta < 0) addLog('Your marriage had a rough patch 💔');
            }
            // Child chance (implied)
            if (G.age >= 20 && G.age <= 45 && G.married && Math.random() < 0.08 * (G.fertility / 50)) {
                addLog('You had a child! 👶');
                applyEffects({ happiness: 15, money: -200 });
            }
        }

        // Random events (40% chance per year)
        if (Math.random() < 0.4) {
            triggerRandomEvent();
        }

        // Check death
        checkDeath();

        // If in prison, serve a year automatically
        if (G.inPrison && G.alive) {
            G.prisonYears -= 1;
            addLog(`Served a year in prison. ${G.prisonYears} years left.`);
            if (G.prisonYears <= 0) {
                G.inPrison = false;
                G.prisonYears = 0;
                G.job = 'Unemployed';
                addLog('Released from prison! 🎉');
                applyEffects({ happiness: 10 });
            }
        }

        render();
        getTagline(`Aged up to ${G.age} as a ${G.job}`).then(t => showTagline(t));
        // Autosave
        saveToLocalStorage();
    }

    // ---------- DEATH CHECK ----------
    function checkDeath() {
        if (!G.alive) return;
        let dead = false;
        let reason = '';

        if (G.health <= 0) {
            dead = true;
            reason = 'Your health gave out. 💀';
        }
        if (G.age >= 70) {
            const prob = Math.min(0.95, (G.age - 70) / 30);
            if (Math.random() < prob) {
                dead = true;
                reason = 'You died of old age. 🕊️';
            }
        }
        if (!dead && Math.random() < 0.008) {
            dead = true;
            reason = 'A fatal accident took your life. 💔';
        }
        if (!dead && G.karma < 10 && Math.random() < 0.04) {
            dead = true;
            reason = 'Karma caught up with you. ⚖️';
        }

        if (dead) {
            G.alive = false;
            addLog(reason);
            render();
            showTagline('💀 Game Over');
            saveToLocalStorage();
        }
    }

            applyEffects({ money: loot, karma: -12, happiness: 6 });

            if (Math.random() < 0.3) goToPrison(rand(2, 6));
        } else {
            applyEffects({ happiness: -15, karma: -8 });
            addLog('Fraud failed! 👮');
            if (Math.random() < 0.6) goToPrison(rand(2, 5));
        }
        getTagline('Committing fraud').then(t => showTagline(t));
        render();
        saveToLocalStorage();
    }

    // Heirloom
    function createHeirloom() {
        if (!G.alive || G.inPrison) return;
        const cost = rand(100, 500);
        if (G.money < cost) { addLog(`You need $${cost} to create an heirloom.`); return; }
        applyEffects({ money: -cost, happiness: 5 });
        const names = ['Gold Watch', 'Diamond Ring', 'Antique Vase', 'Family Sword', 'Pocket Watch', 'Silver Locket',
            'Ruby Brooch', 'Emerald Necklace'
        ];
        const heirloom = pick(names);
        G.heirlooms = G.heirlooms || [];
        G.heirlooms.push({ name: heirloom, value: rand(200, 800) });
        addLog(`Created heirloom: ${heirloom}! 💎`);
        getTagline('Creating an heirloom').then(t => showTagline(t));
        render();
        saveToLocalStorage();
    }

    function viewHeirlooms() {
        if (!G.alive) return;
        const h = G.heirlooms || [];
        if (h.length === 0) { addLog('You have no heirlooms.'); return; }
        const list = h.map((x, i) => `${i+1}. ${x.name} ($${x.value})`).join('; ');
        addLog(`Heirlooms: ${list}`);
        getTagline('Viewing heirlooms').then(t => showTagline(t));
        render();
    }

    function sellHeirloom() {
        if (!G.alive || G.inPrison) return;
        const h = G.heirlooms || [];
        if (h.length === 0) { addLog('You have no heirlooms to sell.'); return; }
        const idx = rand(0, h.length - 1);
        const item = h[idx];
        applyEffects({ money: item.value, happiness: 3 });
        h.splice(idx, 1);
        addLog(`Sold ${item.name} for $${item.value}. 💰`);
        getTagline('Selling an heirloom').then(t => showTagline(t));
        render();
        saveToLocalStorage();
    }

    // BitPass
    function checkBitPass() {
        if (!G.alive) return;
        const bp = G.bitPass || false;
        const bal = G.bitPassBalance || 0;
        addLog(`BitPass: ${bp ? 'Active' : 'Inactive'}, Balance: $${bal} 🎫`);
        getTagline('Checking BitPass').then(t => showTagline(t));
        render();
    }

    function buyBitPass() {
        if (!G.alive || G.inPrison) return;
        const cost = 500;
        if (G.money < cost) { addLog(`You need $${cost} to buy BitPass.`); return; }
        applyEffects({ money: -cost, happiness: 8 });
        G.bitPass = true;
        G.bitPassBalance = (G.bitPassBalance || 0) + 100;
        addLog('Purchased BitPass! Premium features unlocked 🎫');
        getTagline('Buying BitPass').then(t => showTagline(t));
        render();
        saveToLocalStorage();
    }

    // ---------- MENU CONFIG (extensible) ----------
    const menuConfig = [{
        id: 'heirloom',
        label: 'New Heirloom!',
        icon: '💎',
        subOptions: [
            { label: 'Create Heirloom', action: createHeirloom, cssClass: 'heirloom', icon: '🪄' },
            { label: 'View Heirlooms', action: viewHeirlooms, cssClass: 'heirloom', icon: '📜' },
            { label: 'Sell Heirloom', action: sellHeirloom, cssClass: 'heirloom', icon: '💰' },
        ]
    }, {
        id: 'bitpass',
        label: 'BitPass',
        icon: '🎫',
        subOptions: [
            { label: 'Check Balance', action: checkBitPass, cssClass: 'bitpass', icon: '💳' },
            { label: 'Buy BitPass', action: buyBitPass, cssClass: 'bitpass', icon: '⭐' },
        ]
    }, {
        id: 'school',
        label: 'School',
        icon: '📚',
        subOptions: [
            { label: 'Study', action: study, cssClass: 'school', icon: '📖' },
            { label: 'Go to College', action: goToCollege, cssClass: 'school', icon: '🎓' },
            { label: 'Drop Out', action: dropOut, cssClass: 'school', icon: '🚪' },
        ]
    }, {
        id: 'assets',
        label: 'Assets',
        icon: '🏠',
        subOptions: [
            { label: 'Buy House', action: buyHouse, cssClass: 'assets', icon: '🏡' },
            { label: 'Buy Car', action: buyCar, cssClass: 'assets', icon: '🚗' },
            { label: 'View Assets', action: viewAssets, cssClass: 'assets', icon: '📊' },
        ]
    }, {
        id: 'age',
        label: 'Age',
        icon: '📅',
        subOptions: [
            { label: 'Age Up!', action: ageUp, cssClass: 'age', icon: '⬆️' },
        ]
    }, {
        id: 'relationships',
        label: 'Relationships',
        icon: '❤️',
        subOptions: [
            { label: 'Date', action: date, cssClass: 'relationship', icon: '🌹' },
            { label: 'Marry', action: marry, cssClass: 'relationship', icon: '💍' },
            { label: 'Divorce', action: divorce, cssClass: 'relationship', icon: '💔' },
            { label: 'Socialize', action: socialize, cssClass: 'relationship', icon: '🎉' },
        ]
    }, {
        id: 'activities',
        label: 'Activities',
        icon: '🎮',
        subOptions: [
            { label: 'Work', action: work, cssClass: 'job', icon: '💼' },
            { label: 'Go to Gym', action: goToGym, cssClass: 'activity', icon: '🏋️' },
            { label: 'Gamble', action: gamble, cssClass: 'activity', icon: '🎰' },
            { label: 'Theft', action: commitTheft, cssClass: 'crime', icon: '🦹' },
            { label: 'Robbery', action: commitRobbery, cssClass: 'crime', icon: '🔫' },
            { label: 'Fraud', action: commitFraud, cssClass: 'crime', icon: '💳' },
        ]
    }];

    // ---------- UI RENDERING ----------
    let activeCategory = 'age';

    function renderSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.innerHTML = '';
        menuConfig.forEach(cat => {
            const div = document.createElement('div');
            div.className = 'cat-item' + (cat.id === activeCategory ? ' active' : '');
            div.innerHTML = `<span class="icon">${cat.icon}</span> ${cat.label}`;
            div.dataset.id = cat.id;
            div.addEventListener('click', () => {
                activeCategory = cat.id;
                renderSidebar();
                renderContent();
            });
            sidebar.appendChild(div);
        });
    }

    function renderContent() {
        const cat = menuConfig.find(c => c.id === activeCategory);
        const title = document.getElementById('sectionTitle');
        const grid = document.getElementById('actionGrid');
        if (!cat) {
            title.textContent = '—';
            grid.innerHTML = '';
            return;
        }
        title.textContent = cat.label + ' — choose an action';

        if (G.inPrison && cat.id !== 'age') {
            grid.innerHTML =
                `<div style="grid-column:1/-1;padding:20px;text-align:center;color:#6a8aaa;">🔒 You are in prison. Only "Age Up" is available.</div>`;
            return;
        }
        if (!G.alive && cat.id !== 'age') {
            grid.innerHTML =
                `<div style="grid-column:1/-1;padding:20px;text-align:center;color:#6a8aaa;">💀 You are dead. Click "Age Up" to restart.</div>`;
            return;
        }

        grid.innerHTML = '';
        cat.subOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'action-btn ' + (opt.cssClass || '');
            btn.innerHTML = `<span class="icon">${opt.icon || '⚡'}</span> ${opt.label}`;
            if (opt.label === 'Age Up!' && G.inPrison) {
                btn.innerHTML += `<span class="sub">Serve a year</span>`;
            } else if (opt.label === 'Age Up!' && !G.alive) {
                btn.innerHTML += `<span class="sub">Restart</span>`;
            }
            btn.addEventListener('click', () => {
                if (!G.alive && opt.label !== 'Age Up!') {
                    addLog('You are dead. Start a new life.');
                    return;
                }
                if (G.inPrison && opt.label !== 'Age Up!') {
                    addLog('You are in prison. Only "Age Up" is available.');
                    return;
                }
                opt.action();
            });
            grid.appendChild(btn);
        });
    }

    function renderCharCard() {
        document.getElementById('charName').textContent = G.name || '—';
        document.getElementById('charGender').textContent = G.gender || '—';
        document.getElementById('charCountry').textContent = G.country || '—';
        document.getElementById('happinessBar').style.width = G.happiness + '%';
        document.getElementById('happinessVal').textContent = G.happiness;
        document.getElementById('healthBar').style.width = G.health + '%';
        document.getElementById('healthVal').textContent = G.health;
        document.getElementById('smartsBar').style.width = G.smarts + '%';
        document.getElementById('smartsVal').textContent = G.smarts;
        document.getElementById('looksBar').style.width = G.looks + '%';
        document.getElementById('looksVal').textContent = G.looks;
    }

    function renderAgeMoney() {
        document.getElementById('ageDisplay').textContent = `Age: ${G.age}`;
        document.getElementById('moneyDisplay').textContent = `💰 $${Math.floor(G.money)}`;
        document.getElementById('jobDisplay').textContent = G.job || 'Unemployed';
        document.getElementById('eduDisplay').textContent = `Education: ${G.education || 'None'}`;
        const badge = document.getElementById('statusBadge');
        if (!G.alive) {
            badge.innerHTML = `<span class="dead-badge">💀 Dead</span>`;
        } else if (G.inPrison) {
            badge.innerHTML = `<span class="prison-badge">🔒 Prison (${G.prisonYears}y)</span>`;
        } else {
            badge.innerHTML = `<span class="alive-badge">✅ Alive</span>`;
        }
    }

    function renderHiddenTraits() {
        const grid = document.getElementById('traitsGrid');
        const traits = [
            { key: 'athleticism', label: '🏃 Athleticism', val: G.athleticism },
            { key: 'discipline', label: '🎯 Discipline', val: G.discipline },
            { key: 'fertility', label: '👶 Fertility', val: G.fertility },
            { key: 'karma', label: '⚖️ Karma', val: G.karma },
            { key: 'sexuality', label: '🌈 Sexuality', val: G.sexuality },
            { key: 'willpower', label: '💪 Willpower', val: G.willpower },
        ];
        grid.innerHTML = '';
        traits.forEach(t => {
            const div = document.createElement('div');
            div.className = 'trait';
            if (t.key === 'sexuality') {
                div.innerHTML = `${t.label} <span class="val">${t.val}</span>`;
            } else {
                const pct = typeof t.val === 'number' ? t.val : 0;
                div.innerHTML =
                    `${t.label} <span class="bar-bg"><span class="bar-fill" style="width:${pct}%"></span></span> <span class="val">${pct}</span>`;
            }
            grid.appendChild(div);
        });
    }

    function renderLog() {
        const area = document.getElementById('logArea');
        area.innerHTML = '';
        const entries = G.log.slice(0, 50);
        entries.forEach(e => {
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML =
                `<span class="age-tag">[${e.age}]</span><span class="msg">${e.msg} ${e.highlight ? '<span class="highlight">'+e.highlight+'</span>' : ''}</span>`;
            area.appendChild(div);
        });
        if (entries.length === 0) {
            area.innerHTML = '<div class="log-entry" style="color:#4a6a8a;padding:4px 0;">✨ Your life story begins here...</div>';
        }
    }

    function render() {
        renderCharCard();
        renderAgeMoney();
        renderHiddenTraits();
        renderLog();
        renderSidebar();
        renderContent();
    }

    // ---------- NEW LIFE ----------
    function newLife() {
        G = defaultState();
        G.gender = randomGender();
        G.name = randomName(G.gender);
        G.country = randomCountry();
        G.health = rand(40, 90);
        G.happiness = rand(40, 90);
        G.smarts = rand(30, 85);
        G.looks = rand(30, 85);
        G.athleticism = rand(0, 100);
        G.discipline = rand(0, 100);
        G.fertility = rand(0, 100);
        G.karma = rand(0, 100);
        G.sexuality = randomSexuality();
        G.willpower = rand(0, 100);
        G.money = rand(100, 2000);
        G.job = 'Unemployed';
        G.education = 'None';
        G.married = false;
        G.spouse = '';
        G.inPrison = false;
        G.prisonYears = 0;
        G.alive = true;
        G.heirlooms = [];
        G.bitPass = false;
        G.bitPassBalance = 0;
        G.houses = 0;
        G.cars = 0;
        G.log = [];
        G.year = 0;

        document.getElementById('newLifeOverlay').classList.add('hidden');

        addLog('You were born! Welcome to the world! 🎉');
        render();
        showTagline('A new life begins... ✨');
        saveToLocalStorage();
    }

    // ---------- SAVE / LOAD ----------
    function saveToLocalStorage() {
        try {
            const json = JSON.stringify(G);
            localStorage.setItem('onelife_save', json);
        } catch (_) {}
    }

    function loadFromLocalStorage() {
        try {
            const raw = localStorage.getItem('onelife_save');
            if (!raw) return false;
            const data = JSON.parse(raw);
            Object.assign(G, data);
            // Ensure all fields exist
            ['heirlooms', 'houses', 'cars', 'bitPass', 'bitPassBalance'].forEach(k => {
                if (!(k in G)) G[k] = k === 'heirlooms' ? [] : k === 'bitPass' ? false : 0;
            });
            ['health', 'happiness', 'smarts', 'looks', 'athleticism', 'discipline', 'fertility', 'karma', 'willpower']
            .forEach(s => { G[s] = clamp(G[s] || 0, 0, 100); });
            G.money = Math.max(0, G.money || 0);
            document.getElementById('newLifeOverlay').classList.add('hidden');
            render();
            showTagline('Welcome back! 👋');
            return true;
        } catch (_) { return false; }
    }

    function saveGame() {
        if (!G.name) { alert('Start a life first!'); return; }
        const json = JSON.stringify(G);
        const base64 = btoa(unescape(encodeURIComponent(json)));
        const blob = new Blob([base64], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'character.onelife';
        a.click();
        URL.revokeObjectURL(url);
        addLog('Game saved. 💾');
    }

    function loadGame(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const base64 = e.target.result;
                const json = decodeURIComponent(escape(atob(base64)));
                const data = JSON.parse(json);
                Object.assign(G, data);
                ['heirlooms', 'houses', 'cars', 'bitPass', 'bitPassBalance'].forEach(k => {
                    if (!(k in G)) G[k] = k === 'heirlooms' ? [] : k === 'bitPass' ? false : 0;
                });
                ['health', 'happiness', 'smarts', 'looks', 'athleticism', 'discipline', 'fertility', 'karma', 'willpower']
                .forEach(s => { G[s] = clamp(G[s] || 0, 0, 100); });
                G.money = Math.max(0, G.money || 0);
                document.getElementById('newLifeOverlay').classList.add('hidden');
                addLog('Game loaded successfully. 📂');
                render();
                showTagline('Welcome back! 👋');
            } catch (err) {
                alert('Failed to load save file. Invalid format.');
                console.error(err);
            }
        };
        reader.readAsText(file);
    }

    // ---------- INIT ----------
    document.addEventListener('DOMContentLoaded', function() {
        // Try to load from localStorage
        const loaded = loadFromLocalStorage();
        if (!loaded) {
            // Show new life overlay
            document.getElementById('newLifeOverlay').classList.remove('hidden');
            G = defaultState();
            render();
        }

        // Event listeners
        document.getElementById('btnNewLife').addEventListener('click', newLife);
        document.getElementById('btnNewLifeTop').addEventListener('click', () => {
            if (confirm('Start a new life? Current progress will be lost.')) {
                newLife();
            }
        });

        document.getElementById('btnSave').addEventListener('click', saveGame);
        document.getElementById('btnLoad').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });
        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                loadGame(e.target.files[0]);
            }
            e.target.value = '';
        });

        // Hidden traits toggle
        const toggleBtn = document.getElementById('hiddenToggle');
        const panel = document.getElementById('hiddenPanel');
        toggleBtn.addEventListener('click', () => {
            panel.classList.toggle('open');
            toggleBtn.classList.toggle('active');
            toggleBtn.textContent = panel.classList.contains('open') ? '🧩 Hide Hidden Traits' :
                '🧩 Show Hidden Traits';
        });

        // Keyboard shortcut: Age Up with Space
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' && !e.repeat) {
                e.preventDefault();
                if (!G.alive) {
                    newLife();
                    return;
                }
                if (G.inPrison) {
                    ageUp();
                    return;
                }
                ageUp();
            }
        });

        // If no life yet, show overlay
        if (!G.name) {
            document.getElementById('newLifeOverlay').classList.remove('hidden');
        }
    });
</script>
</body>
</html>
