<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STATIC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<style>
  :root{ --accent:#ff2fd0; --accent2:#2fe4ff; --bg:#0b0b10; --panel:#15151d; --line:rgba(255,255,255,.08); }
  html,body{ height:100%; width:100%; margin:0; padding:0; overflow:hidden; position:fixed; inset:0;
    overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; background:#000;
    font-family:-apple-system,system-ui,'Segoe UI',Inter,sans-serif; }
  #app{ position:fixed; inset:0; height:100dvh; width:100vw; overflow:hidden; background:#000; }
  #gameCanvas{ position:absolute; inset:0; display:block; touch-action:none; image-rendering:pixelated; }

  /* ---- HUD ---- */
  #hud{ position:absolute; top:0; left:0; right:0; height:52px; display:flex; align-items:center;
    justify-content:space-between; padding:0 12px; z-index:20; pointer-events:none;
    background:linear-gradient(to bottom, rgba(0,0,0,.55), transparent); }
  #hud .hudBtn{ pointer-events:auto; background:rgba(20,20,28,.75); border:1px solid var(--line); color:#eee;
    border-radius:10px; padding:6px 10px; font-size:12px; font-weight:600; }
  #hudName{ color:#fff; font-size:13px; font-weight:700; text-shadow:0 1px 2px #000; pointer-events:none; }
  #hudBlicks{ color:var(--accent2); font-size:13px; font-weight:700; text-shadow:0 1px 2px #000; }

  /* ---- touch controls ---- */
  #joyBase{ position:fixed; width:90px; height:90px; border-radius:50%; background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.18); display:none; z-index:30; }
  #joyKnob{ position:absolute; width:42px; height:42px; margin:-21px; border-radius:50%;
    background:rgba(255,255,255,.35); left:45px; top:45px; }
  #btnCluster{ position:fixed; right:18px; bottom:26px; z-index:30; display:flex; gap:14px; align-items:flex-end; }
  .roundBtn{ width:58px; height:58px; border-radius:50%; background:rgba(255,47,208,.28);
    border:2px solid rgba(255,47,208,.6); color:#fff; font-weight:800; font-size:12px;
    display:flex; align-items:center; justify-content:center; touch-action:none; }
  .roundBtn:active{ transform:scale(.92); filter:brightness(1.3); }

  /* ---- generic sheet ---- */
  .sheet{ position:fixed; left:50%; bottom:0; transform:translate(-50%,0); width:min(480px,100vw);
    max-height:80vh; background:var(--panel); border:1px solid var(--line); border-top-left-radius:18px;
    border-top-right-radius:18px; z-index:60; display:none; flex-direction:column; overscroll-behavior:contain; }
  .sheet.open{ display:flex; }
  .sheetHead{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px;
    border-bottom:1px solid var(--line); }
  .sheetHead h2{ margin:0; font-size:15px; color:#fff; }
  .sheetClose{ background:none; border:none; color:#aaa; font-size:20px; padding:4px 8px; }
  .sheetBody{ overflow-y:auto; overscroll-behavior:contain; padding:10px 14px 20px; -webkit-overflow-scrolling:touch; }
  .row{ display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); }
  .row .ico{ width:34px; height:34px; flex:none; }
  .row .label{ flex:1; color:#eee; font-size:14px; }
  .row .sub{ color:#888; font-size:11px; }
  .row button{ background:var(--accent); border:none; color:#fff; font-weight:700; font-size:12px;
    padding:7px 12px; border-radius:8px; }
  .statbar{ height:7px; border-radius:4px; background:rgba(255,255,255,.1); overflow:hidden; margin-top:4px; }
  .statbar > div{ height:100%; background:#33d17a; }

  /* ---- dialogue ---- */
  #dialogueBox{ position:fixed; left:50%; bottom:14px; transform:translateX(-50%); width:min(460px,94vw);
    background:rgba(15,15,22,.96); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
    z-index:70; display:none; }
  #dialogueBox.open{ display:block; }
  #dialogueSpeaker{ color:var(--accent2); font-size:11px; font-weight:800; letter-spacing:.08em;
    text-transform:uppercase; margin-bottom:4px; }
  #dialogueText{ color:#f0f0f0; font-size:14px; line-height:1.4; margin-bottom:10px; }
  #dialogueChoices{ display:flex; flex-direction:column; gap:8px; }
  #dialogueChoices button{ background:rgba(255,255,255,.06); border:1px solid var(--line); color:#fff;
    text-align:left; padding:10px 12px; border-radius:9px; font-size:13px; }
  #dialogueChoices button:active{ background:rgba(255,47,208,.25); }

  /* ---- battle ---- */
  #battleScreen{ position:fixed; inset:0; z-index:80; display:none; background:#0a0a12; }
  #battleScreen.open{ display:block; }
  #battleCanvas{ width:100%; height:calc(100% - 190px); display:block; }
  #battleUI{ position:absolute; left:0; right:0; bottom:0; height:190px; background:var(--panel);
    border-top:1px solid var(--line); padding:10px 12px; box-sizing:border-box; overflow:hidden; }
  #battleLog{ color:#ddd; font-size:13px; height:34px; margin-bottom:8px; line-height:1.3; }
  #moveGrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  #moveGrid button{ background:rgba(255,255,255,.06); border:1px solid var(--line); color:#fff;
    padding:12px 8px; border-radius:10px; font-size:13px; font-weight:700; }
  #moveGrid button:active{ background:rgba(47,228,255,.2); }
  #battleSwitchGrid{ display:none; grid-template-columns:1fr 1fr; gap:8px; }
  #battleSwitchGrid button{ background:rgba(255,255,255,.06); border:1px solid var(--line); color:#fff;
    padding:10px 8px; border-radius:10px; font-size:12px; text-align:left; }

  /* ---- title ---- */
  #titleScreen{ position:fixed; inset:0; z-index:100; background:radial-gradient(circle at 50% 20%,#1c1c2c,#050508);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  #titleScreen h1{ color:#fff; font-size:42px; letter-spacing:.12em; margin:0; text-shadow:0 0 24px var(--accent); }
  #titleScreen p{ color:#999; font-size:13px; margin:0 0 10px; text-align:center; max-width:280px; }
  #titleScreen button{ width:220px; padding:14px; border-radius:12px; border:1px solid var(--line);
    background:rgba(255,255,255,.06); color:#fff; font-size:14px; font-weight:700; }
  #titleScreen button.primary{ background:var(--accent); border-color:var(--accent); }
  #fileImportInput{ display:none; }

  /* ---- error overlay ---- */
  #errorOverlay{ position:fixed; inset:0; display:none; place-items:center; z-index:9999; pointer-events:none; }
  #errorOverlay.show{ display:grid; }
  .errPanel{ pointer-events:auto; max-width:420px; width:88%; background:rgba(20,20,24,.97);
    border:1px solid #ef4444; border-radius:14px; padding:18px; text-align:center; }
  .errPanel .t{ color:#ef4444; font-weight:800; font-size:14px; margin-bottom:6px; }
  .errPanel .d{ color:#ccc; font-family:monospace; font-size:11px; word-break:break-word; margin-bottom:12px; }
  .errPanel button{ background:#ef4444; border:none; color:#fff; padding:8px 16px; border-radius:8px; font-weight:700; }
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="hudName"></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div id="hudBlicks">◆ 0</div>
      <button class="hudBtn" id="btnQuests">Quests</button>
      <button class="hudBtn" id="btnBackpack">Backpack</button>
      <button class="hudBtn" id="btnSave">Save</button>
    </div>
  </div>

  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="btnCluster">
    <div class="roundBtn" id="btnInteract">TALK</div>
  </div>

  <!-- Quest log -->
  <div class="sheet" id="questSheet">
    <div class="sheetHead"><h2>Quest Log</h2><button class="sheetClose" data-close="questSheet">✕</button></div>
    <div class="sheetBody" id="questList"></div>
  </div>

  <!-- Backpack (fully custom-coded, no image assets) -->
  <div class="sheet" id="backpackSheet">
    <div class="sheetHead"><h2>Backpack</h2><button class="sheetClose" data-close="backpackSheet">✕</button></div>
    <div class="sheetBody">
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <button class="hudBtn" id="tabItems" style="flex:1;">Items</button>
        <button class="hudBtn" id="tabParty" style="flex:1;">Glyphs</button>
      </div>
      <div id="itemsPane"></div>
      <div id="partyPane" style="display:none;"></div>
    </div>
  </div>

  <!-- Dialogue -->
  <div id="dialogueBox">
    <div id="dialogueSpeaker"></div>
    <div id="dialogueText"></div>
    <div id="dialogueChoices"></div>
  </div>

  <!-- Battle -->
  <div id="battleScreen">
    <canvas id="battleCanvas"></canvas>
    <div id="battleUI">
      <div id="battleLog">A wild Glyph appeared!</div>
      <div id="moveGrid"></div>
      <div id="battleSwitchGrid"></div>
    </div>
  </div>

  <!-- Title -->
  <div id="titleScreen">
    <h1>STATIC</h1>
    <p>A signal-tower town, four broadcast eras, and the creatures born from the noise between them.</p>
    <button class="primary" id="btnNewGame">New Life</button>
    <button id="btnLoadGame">Import Save File</button>
    <input type="file" id="fileImportInput" accept="application/json">
  </div>

  <div id="errorOverlay"><div class="errPanel">
    <div class="t">⚠ Something went wrong</div>
    <div class="d" id="errDetail"></div>
    <button id="errDismiss">Dismiss</button>
  </div></div>
</div>

<script type="module" src="./assets/engine/main.js"></script>
</body>
</html>
